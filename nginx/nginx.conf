# Лаба 8: nginx как reverse proxy перед двумя экземплярами приложения (docker compose)
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    server_tokens off;                       # не показываем версию nginx
    sendfile      on;
    keepalive_timeout 65;
    client_max_body_size 10m;                # ограничение размера тела запроса

    # свой формат логов: + время обработки, время ответа апстрима и request_id
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                    '"$http_x_forwarded_for" rt=$request_time urt=$upstream_response_time '
                    'upstream=$upstream_addr rid=$request_id';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # rate limiting: 10 запросов/с с одного IP, отдельная зона для входа
    limit_req_zone $binary_remote_addr zone=api:10m   rate=10r/s;
    limit_req_zone $binary_remote_addr zone=login:10m rate=1r/s;
    limit_req_status 429;

    upstream library_api {
        least_conn;                          # к тому, у кого меньше активных соединений
        server app1:8000 max_fails=3 fail_timeout=10s;
        server app2:8000 max_fails=3 fail_timeout=10s;
        keepalive 16;
    }

    # HTTP -> HTTPS (кроме проверки certbot)
    server {
        listen 80;
        server_name _;
        location /.well-known/acme-challenge/ { root /var/www/certbot; }
        location / { return 301 https://$host$request_uri; }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name library.local;

        # самоподписанный сертификат: scripts/make_cert.sh; в проде — Let's Encrypt (certbot)
        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        access_log /var/log/nginx/api_access.log main;

        # статика отдаётся nginx'ом напрямую, без обращения к приложению
        location /static/ {
            alias /var/www/static/;
            expires 30d;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        location = /auth/login {
            limit_req zone=login burst=5 nodelay;
            include /etc/nginx/proxy_params_library;
            proxy_pass http://library_api;
        }

        # долгие операции: увеличенный тайм-аут чтения
        location /api/long {
            proxy_next_upstream off;         # долгий запрос не повторяем на другом сервере -> честный 504
            proxy_read_timeout 300s;
            include /etc/nginx/proxy_params_library;
            proxy_pass http://library_api;
        }

        location / {
            limit_req zone=api burst=20 nodelay;
            proxy_connect_timeout 5s;
            proxy_send_timeout    30s;
            proxy_read_timeout    30s;
            include /etc/nginx/proxy_params_library;
            proxy_pass http://library_api;
        }

        # ошибки прокси отдаём в том же JSON-формате, что и приложение
        error_page 429 = @too_many;
        error_page 502 503 = @unavailable;
        error_page 504 = @timeout;
        location @too_many {
            default_type application/json;
            add_header Retry-After 1 always;
            return 429 '{"error":{"code":"TOO_MANY_REQUESTS","message":"Слишком много запросов","details":[],"request_id":"$request_id"}}';
        }
        location @unavailable {
            default_type application/json;
            return 503 '{"error":{"code":"SERVICE_UNAVAILABLE","message":"Сервис временно недоступен","details":[],"request_id":"$request_id"}}';
        }
        location @timeout {
            default_type application/json;
            return 504 '{"error":{"code":"GATEWAY_TIMEOUT","message":"Сервер не ответил вовремя","details":[],"request_id":"$request_id"}}';
        }
    }
}
