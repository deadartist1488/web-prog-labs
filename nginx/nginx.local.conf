# Та же конфигурация для запуска без Docker (Windows, portable nginx в tools/nginx-1.26.2).
# include и ssl_certificate считаются от папки nginx/ (где лежит конфиг), alias и logs — от префикса tools/nginx-1.26.2
#   cd tools/nginx-1.26.2 && nginx.exe -c ../../nginx/nginx.local.conf
worker_processes 1;

events {
    worker_connections 256;
}

http {
    include       ../tools/nginx-1.26.2/conf/mime.types;
    default_type  application/octet-stream;
    server_tokens off;
    client_max_body_size 10m;

    log_format main '$remote_addr - [$time_local] "$request" $status $body_bytes_sent '
                    '"$http_user_agent" rt=$request_time urt=$upstream_response_time '
                    'upstream=$upstream_addr rid=$request_id';
    access_log logs/access.log main;
    error_log  logs/error.log warn;

    gzip on;
    gzip_min_length 512;
    gzip_types text/plain text/css application/json application/javascript;

    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_status 429;

    upstream library_api {
        least_conn;
        server 127.0.0.1:8000 max_fails=3 fail_timeout=10s;
        server 127.0.0.1:8001 max_fails=3 fail_timeout=10s;
        keepalive 8;
    }

    # для сравнения с least_conn: обычный round-robin (по умолчанию)
    upstream library_rr {
        server 127.0.0.1:8000;
        server 127.0.0.1:8001;
    }

    server {
        listen 8081;
        location / {
            include proxy_params.conf;
            proxy_pass http://library_rr;
        }
    }

    server {
        listen 8080;
        return 301 https://$host:8443$request_uri;
    }

    server {
        listen 8443 ssl;
        server_name localhost;
        ssl_certificate     certs/fullchain.pem;
        ssl_certificate_key certs/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;

        location /static/ {
            alias ../../nginx/static/;
            expires 30d;
        }

        location /api/long {
            proxy_next_upstream off;         # долгий запрос не повторяем на другом сервере -> честный 504
            proxy_read_timeout 3s;           # для демонстрации 504 при ?seconds=5
            include proxy_params.conf;
            proxy_pass http://library_api;
        }

        location / {
            limit_req zone=api burst=20 nodelay;
            proxy_read_timeout 30s;
            include proxy_params.conf;
            proxy_pass http://library_api;
        }

        error_page 429 = @too_many;
        error_page 502 503 = @unavailable;
        error_page 504 = @timeout;
        location @too_many {
            default_type application/json;
            return 429 '{"error":{"code":"TOO_MANY_REQUESTS","message":"rate limit","details":[],"request_id":"$request_id"}}';
        }
        location @unavailable {
            default_type application/json;
            return 503 '{"error":{"code":"SERVICE_UNAVAILABLE","message":"upstream down","details":[],"request_id":"$request_id"}}';
        }
        location @timeout {
            default_type application/json;
            return 504 '{"error":{"code":"GATEWAY_TIMEOUT","message":"upstream timeout","details":[],"request_id":"$request_id"}}';
        }
    }
}
