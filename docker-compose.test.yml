# Лаба 9: изолированное тестовое окружение (отдельные порты, данные в tmpfs — после остановки ничего не остаётся)
#   docker compose -f docker-compose.test.yml up -d
#   TEST_DATABASE_URL=postgresql://test:test@localhost:5433/test_db TEST_REDIS_URL=redis://localhost:6380/0 pytest
#   docker compose -f docker-compose.test.yml down -v
name: web-prog-labs-test   # отдельный проект: не пересекается с основным стендом

services:
  test-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: test_db
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d test_db"]
      interval: 2s
      retries: 15

  test-redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
