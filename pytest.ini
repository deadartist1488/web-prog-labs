[pytest]
testpaths = tests
addopts = -q
markers =
    unit: быстрые тесты без БД и HTTP (моки)
    api: тесты HTTP API через TestClient (SQLite в памяти + fakeredis)
    postgres: интеграционные тесты на настоящем PostgreSQL (pgserver или TEST_DATABASE_URL)
filterwarnings =
    ignore::DeprecationWarning
